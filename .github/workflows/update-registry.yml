name: Update harness capability registry

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      historical_days:
        description: Historical release window to refresh
        required: false
        default: "120"

concurrency:
  group: harness-capability-registry-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HCR_DAYS: ${{ inputs.historical_days || '120' }}
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install -e '.[dev]'

      - name: Refresh releases and documentation drift
        run: python -m hcr update --since-days "$HCR_DAYS" --max-pages 20 --snapshot-docs | tee /tmp/hcr-update.log

      - name: Run deterministic validation suite
        run: |
          python -m pytest
          node --check app/app.js

      - name: Summarize update
        run: |
          {
            echo "## Harness Capability Registry"
            echo
            echo '```json'
            cat /tmp/hcr-update.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or refresh update pull request
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/harness-capability-registry-update"
          git config user.name "hcr-update-bot"
          git config user.email "hcr-update-bot@users.noreply.github.com"

          # `app/data`, `generated/registry.bundle.json` and
          # `generated/Harness_Matrix_Standalone.html` are gone from this list on
          # purpose: every path under them is now ignored, and `git add` on a
          # fully-ignored path exits non-zero, which under `set -e` would fail the
          # job. They are regenerable via `make generate`
          # (node_01M03EVAX5A6G0RZCT4NXSKTRQ). `raw` stays — it still carries the
          # CHANGELOG snapshots and source-snapshots that are tracked; the
          # content-addressed API caches inside it are ignored per-pattern, which
          # `git add raw` skips silently rather than erroring on.
          git add \
            registry \
            raw \
            generated/agent-guides \
            generated/reports/coverage.md \
            generated/validation-report.json \
            generated/source-drift-report.json

          if git diff --cached --quiet; then
            echo "No upstream capability or release changes detected."
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "chore(hcr): refresh upstream harness intelligence"
          git push --force origin "HEAD:$BRANCH"

          # Must test for an OPEN pull request, not merely any pull request:
          # `gh pr view <branch>` also resolves a MERGED or CLOSED PR for that
          # branch, and `gh pr edit` on one fails — so the first run after a
          # maintainer merges the standing automation PR would take the edit
          # branch and die there. Ask the question the next step can actually act
          # on.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" \
              --title "chore(hcr): refresh upstream harness intelligence" \
              --body "Automated refresh of official release history, documentation drift, normalized guides, and web-app bundles. Validation passed before this pull request was updated."
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "chore(hcr): refresh upstream harness intelligence" \
              --body "Automated refresh of official release history, documentation drift, normalized guides, and web-app bundles. Validation passed before this pull request was opened."
          fi
